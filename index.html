<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#164e42"><meta name="apple-mobile-web-app-capable" content="yes"><title>每日有数</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><main><header><div><small>YOUR DAILY LEDGER</small><h1>每日有数 ◒</h1></div><button id="add" class="primary">＋ 记一笔</button></header><section class="hero"><p id="today"></p><div>当前剩余余额</div><strong id="balance"></strong><div class="herofoot">今日收入 <b id="inc"></b>　 今日支出 <b id="out"></b></div></section><nav><button data-tab="ledger" class="active">每日账本</button><button data-tab="stats">收支统计</button><button data-tab="settings">设置与备份</button></nav><section id="ledger"><div class="sectionhead"><h2>每一天，都心中有数</h2><input id="month" type="month" aria-label="账本月份"></div><p class="muted">每笔真实收支，都让余额更清晰</p><div id="days"></div></section><section id="stats" hidden><h2>收支概览</h2><div class="filters"><select id="period"><option value="month">按月</option><option value="year">按年</option><option value="custom">自选时间</option></select><input type="month" id="statmonth" aria-label="统计月份"><input id="year" type="number" aria-label="年份" hidden><input id="from" type="date" aria-label="开始日期" hidden><input id="to" type="date" aria-label="结束日期" hidden></div><div id="totals"></div><div class="seg"><button data-kind="expense" class="active">支出分类</button><button data-kind="income">收入分类</button></div><div id="categories"></div><h3 id="detailtitle">期间明细</h3><button id="allstats" hidden>查看全部类别</button><div id="statdetails"></div></section><section id="settings" hidden><h2>我的账本</h2><div class="card"><h3>初始余额</h3><p class="muted">设置开始记账当天、发生收支之前的余额。</p><form id="setup"><label>开始日期<input id="start" type="date" required></label><label>初始余额（元）<input id="opening" type="number" step="0.01" required></label><button class="primary">保存设置</button></form></div><div class="card"><h3>类别管理</h3><div id="catlist"></div><form id="newcat" class="filters"><select id="cattype"><option value="expense">支出</option><option value="income">收入</option></select><input id="catname" placeholder="新类别名称" maxlength="20" required><button>添加</button></form></div><div class="card"><h3>导出与备份</h3><p class="muted">数据仅保存在当前浏览器，请定期备份。换手机或清除浏览器数据前，请先导出完整备份。</p><button id="excel">导出 Excel</button><button id="backup">导出完整备份</button><label class="file">恢复备份<input id="restore" type="file" accept=".json"></label><p class="muted">Excel 包含收支明细、每日余额、分类汇总。完整备份可重新导入；恢复会替换当前账本。</p></div><p class="muted">在手机浏览器菜单中选择“添加到主屏幕”，即可从桌面打开。不提供跨设备自动同步。</p></section><footer>把日子记清楚，把生活过从容。</footer></main><dialog id="entry"><form id="entryform"><div class="sectionhead"><h2 id="formtitle">记一笔</h2><button id="close" type="button">✕</button></div><p id="entrydate" class="muted"></p><label>类型<select id="type"><option value="expense">支出</option><option value="income">收入</option></select></label><label>金额（元）<input id="amount" type="number" inputmode="decimal" min="0.01" max="999999999" step="0.01" placeholder="0.00" required></label><label>类别<select id="category"></select></label><label>备注（选填）<input id="note" maxlength="200" placeholder="记下这笔钱的用途"></label><label id="editdatewrap" hidden>记录日期<input id="editdate" type="date"></label><button class="primary wide">保存记录</button><button id="del" type="button" class="danger wide" hidden>删除这笔记录</button></form></dialog><div id="toast" role="status"></div><script src="app.js"></script></html>
